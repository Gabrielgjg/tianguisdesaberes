<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tianguis de Saberes · Weird Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EC; --paper-2:#F3EAD8; --card:#FFFDF8; --ink:#2A2118; --ink-2:#5C4E3F; --line:#E2D5BE;
  --maiz:#E3A21A; --frijol:#8E2B1E; --milpa:#3F6B2A; --anil:#2E4A7D; --ok:#2F7D32; --bad:#B23A2A;
  --r:14px; --shadow:0 2px 0 rgba(60,40,10,.08), 0 8px 24px rgba(60,40,10,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;
  background-image:radial-gradient(rgba(140,100,40,.06) 1px,transparent 1px);background-size:6px 6px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:.3em 0 .7em}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--paper-2);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--frijol);color:#fff;font-weight:700}
.btn-g{background:var(--milpa);color:#fff;font-weight:700}
.btn-o{background:transparent;border:2px solid var(--line)}
.btn-s{padding:6px 10px;font-size:.9rem}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;margin:6px 0}
label.ck input{width:auto;margin-top:4px}
label.ck.on{border-color:var(--milpa);background:#F1F6EA}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.narrow{max-width:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.muted{color:var(--ink-2)} .small{font-size:.88rem} .center{text-align:center}
.hidden{display:none!important}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--paper-2);color:var(--ink-2)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.78rem;background:#EFE6D2;margin:2px 2px 0 0}
.top{background:var(--ink);color:#FBF6EC;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{font-family:'Fraunces',serif;font-weight:800;font-size:1.2rem}
.top .sp{flex:1}
.net{font-size:.8rem;padding:2px 8px;border-radius:99px;background:#3a3127}
.net.off{background:var(--bad)}
.papel{height:14px;background:
  linear-gradient(135deg,var(--maiz) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--maiz) 25%,transparent 25%) -7px 0/14px 14px;}
/* hero */
.hero{padding:28px 16px;text-align:center}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);color:var(--frijol)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.choice .card{cursor:pointer;transition:transform .1s}
.choice .card:hover{transform:translateY(-2px)}
.choice .big{font-size:2rem}
/* team */
.banner{color:#fff;padding:14px 16px;border-radius:var(--r);margin-bottom:12px}
.banner h2{margin:0;font-size:1.3rem}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.meter{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 8px;font-size:.8rem}
.meter .bar{height:8px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;position:sticky;top:0;background:var(--paper);z-index:5;padding-top:6px}
.tabs button{white-space:nowrap;position:relative}
.tabs button.on{background:var(--ink);color:#fff}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;min-width:20px;height:20px;line-height:20px;padding:0 5px}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0;cursor:pointer}
.item .em{font-size:1.7rem;width:40px;text-align:center}
.item .nm{font-weight:700}
.item.zero{opacity:.45}
.qty{margin-left:auto;font-weight:700;white-space:nowrap}
.reto{border-left:6px solid var(--maiz)}
.reto.done{border-left-color:var(--ok);background:#F3F8EE}
.need{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:#fff;border:2px solid var(--line)}
.opt:hover{border-color:var(--anil)}
.fb{padding:10px 12px;border-radius:10px;margin:8px 0}
.fb.ok{background:#E6F2E1;border:1px solid #9CC58D}
.fb.bad{background:#FBE7E3;border:1px solid #E3A598}
.fb.info{background:#EAF0FA;border:1px solid #A9BEE0}
.warn{background:#FFF3D6;border:1px solid #E8C770;padding:8px 10px;border-radius:10px;font-size:.9rem}
.lock{background:var(--paper-2);border:2px dashed var(--line);padding:16px;border-radius:var(--r);text-align:center;color:var(--ink-2)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,20,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal .box{background:var(--card);border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px}
@media(min-width:700px){.modal{align-items:center}}
/* board */
.board{display:grid;grid-template-columns:1fr 340px;gap:14px}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stall{border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stall .hd{color:#fff;padding:10px 12px}
.stall .hd b{font-family:'Fraunces',serif;font-size:1.1rem}
.stall .bd{padding:10px 12px}
.mrow{display:flex;align-items:center;gap:6px;font-size:.85rem;margin:3px 0}
.mrow .bar{flex:1;height:10px;background:var(--paper-2);border-radius:99px;overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.feed{max-height:430px;overflow:auto}
.feed div{padding:7px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.timer{font-family:'Fraunces',serif;font-size:3rem;font-weight:800;text-align:center;letter-spacing:2px}
.timer.low{color:var(--bad)}
.collective{font-family:'Fraunces',serif;font-size:2.4rem;font-weight:800;color:var(--milpa)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
table.t th{background:var(--paper-2)}
.qrbig{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.qrbig img{width:220px;height:220px;image-rendering:pixelated;display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:99;font-size:.95rem;max-width:90vw}
.guide h2{margin-top:1.2em;color:var(--frijol)}
.guide li{margin:.3em 0}
.sess{border-left:4px solid var(--maiz);padding-left:12px;margin:10px 0}
.code{font-family:monospace;background:#2A2118;color:#FBF6EC;padding:12px;border-radius:10px;font-size:.82rem;white-space:pre-wrap;overflow:auto}
@media print{.top,.papel,.noprint{display:none!important} body{background:#fff} .card{box-shadow:none;break-inside:avoid}}
</style>
</head>

<div class="papel"></div>
<main id="app"></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>

<script>
const GS_CODE = "/**\n * TIANGUIS DE SABERES · Backend en Google Apps Script\n * Crea dos pestañas en tu hoja: Tianguis_Acciones y Tianguis_Quiz.\n *\n * OPCIÓN A (proyecto nuevo): pega todo este archivo, guarda e implementa como\n *   Aplicación web · Ejecutar como: Yo · Acceso: Cualquier usuario.\n *\n * OPCIÓN B (ya tienes un Apps Script con doGet para tus otros juegos):\n *   1) Pega este archivo como un archivo .gs nuevo, PERO borra la función doGet de abajo.\n *   2) En tu doGet existente agrega al inicio:\n *        if (e && e.parameter && e.parameter.app === 'tianguis') return tianguisHandle(e);\n *   3) Implementa una nueva versión.\n */\n\nfunction doGet(e) { return tianguisHandle(e); }\n\nconst TQ_ACC = 'Tianguis_Acciones';\nconst TQ_QUIZ = 'Tianguis_Quiz';\n\nfunction tianguisHandle(e) {\n  const p = (e && e.parameter) || {};\n  let out;\n  try {\n    if (p.op === 'append') out = tqAppend_(String(p.game || '').toUpperCase(), p.team || '', p.a || '');\n    else if (p.op === 'list') out = tqList_(String(p.game || '').toUpperCase(), Number(p.since || 0));\n    else if (p.op === 'quiz') out = tqQuiz_(p);\n    else if (p.op === 'ping') out = { ok: true };\n    else out = { ok: false, error: 'op desconocida' };\n  } catch (err) {\n    out = { ok: false, error: String(err && err.message || err) };\n  }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction tqSheet_(name, headers) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(headers); sh.setFrozenRows(1); }\n  return sh;\n}\n\n/* Lista de acciones de una partida: primero en caché (rápido), si no, desde la hoja */\nfunction tqLoad_(game) {\n  const cache = CacheService.getScriptCache();\n  const c = cache.get('tq_' + game);\n  if (c) return JSON.parse(c);\n  const sh = tqSheet_(TQ_ACC, ['Fecha', 'Partida', 'Seq', 'Equipo', 'Tipo', 'Accion']);\n  const last = sh.getLastRow();\n  const list = [];\n  if (last > 1) {\n    sh.getRange(2, 1, last - 1, 6).getValues().forEach(r => {\n      if (String(r[1]) === game) list.push([Number(r[2]), String(r[5])]);\n    });\n  }\n  list.sort((a, b) => a[0] - b[0]);\n  tqCache_(game, list);\n  return list;\n}\nfunction tqCache_(game, list) {\n  try { CacheService.getScriptCache().put('tq_' + game, JSON.stringify(list), 21600); }\n  catch (e) { CacheService.getScriptCache().remove('tq_' + game); } // demasiado grande: se leerá de la hoja\n}\n\nfunction tqAppend_(game, team, actionJson) {\n  if (!game) throw new Error('Falta el código de partida');\n  const action = JSON.parse(actionJson);\n  if (!action || !action.type) throw new Error('Acción inválida');\n  const lock = LockService.getScriptLock();\n  lock.waitLock(15000);\n  try {\n    const list = tqLoad_(game);\n    if (action.type === 'create' && list.length) throw new Error('Ese código ya existe');\n    if (action.type !== 'create' && !list.length) throw new Error('No existe esa partida');\n    const seq = list.length + 1;\n    const sh = tqSheet_(TQ_ACC, ['Fecha', 'Partida', 'Seq', 'Equipo', 'Tipo', 'Accion']);\n    sh.appendRow([new Date(), game, seq, team, action.type, actionJson]);\n    list.push([seq, actionJson]);\n    tqCache_(game, list);\n    return { ok: true, seq: seq };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction tqList_(game, since) {\n  const list = tqLoad_(game);\n  const actions = list.filter(r => r[0] > since).map(r => { const a = JSON.parse(r[1]); a.seq = r[0]; return a; });\n  return { ok: true, actions: actions };\n}\n\nfunction tqQuiz_(p) {\n  const sh = tqSheet_(TQ_QUIZ, ['Fecha', 'Partida', 'Grupo', 'Alumno', 'Puesto', 'Aciertos', 'Total', 'Calificación (5-10)', 'Detalle']);\n  sh.appendRow([new Date(), p.game || '', p.grupo || '', p.alumno || '', p.comunidad || '', Number(p.aciertos || 0), Number(p.total || 0), Number(p.calif || 0), p.detalle || '']);\n  return { ok: true };\n}\n";

  { id: 'wix', name: 'Wixárika', people: 'wixaritari', color: '#A8461F', icon: '🌄',

/* =================== RED (registro de acciones) ===================
   Cada dispositivo envía "acciones" (unirse, proponer trueque, resolver reto...).
   El servidor solo las guarda en orden; cada dispositivo reconstruye el estado del juego. */
const Net = {
  code: null, actions: [], last: 0, timer: null, onChange: null, busy: false, again: false, interval: 3000,
  mode() { return apiUrl() ? 'remote' : 'local'; },
  async call(params) {
    const u = apiUrl() + '?app=tianguis&' + Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&') + '&_=' + Date.now();
    const r = await fetch(u); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Error del servidor'); return j;
  },
  async list(code, since) {
    if (this.mode() === 'local') return LS.get('tq_local_' + code, []).filter(a => a.seq > since);
    return (await this.call({ op: 'list', game: code, since })).actions;
  },
  async append(code, action) {
    action.ts = Date.now();
    if (this.mode() === 'local') { const all = LS.get('tq_local_' + code, []); all.push({ ...action, seq: all.length + 1 }); LS.set('tq_local_' + code, all); return all.length; }
    return (await this.call({ op: 'append', game: code, team: action.team || '', a: JSON.stringify(action) })).seq;
  },
  start(code, onChange, interval) {
    this.stop(); this.code = code; this.actions = []; this.last = 0; this.onChange = onChange; this.interval = interval || 3000;
    const tick = async () => { await this.pull(); this.timer = setTimeout(tick, this.mode() === 'local' ? 1200 : this.interval); };
    this._st = e => { if (e.key === 'tq_local_' + code) this.pull(); };
    window.addEventListener('storage', this._st);
    tick();
  },
  stop() { clearTimeout(this.timer); if (this._st) window.removeEventListener('storage', this._st); this._st = null; this.code = null; },
  async pull() {
    if (!this.code) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      const n = await this.list(this.code, this.last);
      let changed = false;
      n.sort((a, b) => a.seq - b.seq).forEach(a => { if (a.seq === this.last + 1) { this.actions.push(a); this.last = a.seq; changed = true; } });
      setNet(true);
      if (changed && this.onChange) this.onChange();
    } catch (e) { setNet(false); }
    finally { this.busy = false; if (this.again) { this.again = false; this.pull(); } }
  },
  async send(action) {
    try { await this.append(this.code, action); await this.pull(); return true; }
    catch (e) { toast('No se pudo enviar. Revisa la conexión e intenta otra vez.'); setNet(false); return false; }
  }
};

/* =================== MOTOR DEL JUEGO (determinista) =================== */
function build(actions) {
  let S = null;
  for (const a of actions) {
    if (a.type === 'create') { if (!S) S = initState(a); }
    else if (S) { try { apply(S, a); } catch (e) { console.warn('acción ignorada', a, e); } }
  }
  return S;
}
function initState(a) {
  const S = { code: a.code, grupo: a.grupo || '', comms: a.comms, phase: 'conocer', teams: {}, trades: {}, tradeList: [], events: [], feed: [], retos: {} };
  const tags = new Set();
  a.comms.forEach(c => ITEMS.filter(i => i.c === c).forEach(i => i.tags.forEach(t => tags.add(t))));
  a.comms.forEach(c => {
    const inv = {}; ITEMS.filter(i => i.c === c).forEach(i => inv[i.id] = isMat(i) ? 2 : 1);
    S.teams[c] = { c, joined: false, names: '', open: false, check: null, inv, origin: {}, meters: { ali: 3, sal: 3, bos: 3 },
      done: {}, fails: {}, taught: 0, learned: 0, given: 0, propOut: 0, propOk: 0, flags: {}, choices: {}, evRes: {}, reflect: null };
    S.retos[c] = RETOS.filter(r => r.c === c && r.tags.every(t => tags.has(t))).map(r => r.id);
  });
  return S;
}
function hasTag(T, tag) { return Object.entries(T.inv).some(([id, q]) => q > 0 && IT[id].tags.includes(tag)); }
function feed(S, a, txt) { S.feed.push({ ts: a.ts, t: txt }); }
function bump(T, fx) { Object.entries(fx || {}).forEach(([m, v]) => T.meters[m] = clamp(T.meters[m] + v)); }
function apply(S, a) {
  const T = a.comm ? S.teams[a.comm] : null;
  switch (a.type) {
    case 'join': if (!T) return; T.joined = true; T.names = a.names || T.names;
      feed(S, a, `${CM[a.comm].icon} Llegó el equipo del puesto <b>${esc(CM[a.comm].name)}</b>.`); break;
    case 'abrir': if (!T || T.open) return; T.open = true; T.check = a.score;
      feed(S, a, `🏮 El puesto <b>${esc(CM[a.comm].name)}</b> abrió: ya conoce sus saberes.`); break;
    case 'phase': S.phase = a.phase;
      feed(S, a, a.phase === 'tianguis' ? '📣 ¡Abre el tianguis! Ya se puede intercambiar.' : a.phase === 'cierre' ? '🌙 Se cierra el tianguis. Momento de reflexionar.' : '📖 Fase: conocer la comunidad.'); break;
    case 'propose': {
      const F = S.teams[a.from], To = S.teams[a.to];
      if (!F || !To || a.from === a.to || S.phase !== 'tianguis' || S.trades[a.id]) return;
      S.trades[a.id] = { id: a.id, from: a.from, to: a.to, give: a.give || [], want: a.want || [], why: a.why || '', status: 'pend', ts: a.ts };
      S.tradeList.push(a.id); F.propOut++; break;
    }
    case 'cancel': { const tr = S.trades[a.id]; if (tr && tr.status === 'pend' && tr.from === a.comm) tr.status = 'cancelado'; break; }
    case 'respond': {
      const tr = S.trades[a.id]; if (!tr || tr.status !== 'pend' || tr.to !== a.comm) return;
      if (!a.accept) { tr.status = 'rechazado'; tr.reply = a.reply || ''; return; }
      const F = S.teams[tr.from], To = S.teams[tr.to];
      const can = (X, ids) => ids.every(id => (X.inv[id] || 0) > 0);
      if (!can(F, tr.give) || !can(To, tr.want)) { tr.status = 'fallido'; return; }
      const move = (A, B, ids, aC) => ids.forEach(id => {
        const it = IT[id];
        if (isMat(it)) { A.inv[id]--; B.inv[id] = (B.inv[id] || 0) + 1; A.given++; }
        else if (!(B.inv[id] > 0)) { B.inv[id] = 1; A.taught++; B.learned++; }
        if (!B.origin[id] && it.c !== B.c) B.origin[id] = aC;
      });
      move(F, To, tr.give, tr.from); move(To, F, tr.want, tr.to);
      tr.status = 'ok'; tr.reply = a.reply || ''; F.propOk++;
      const names = ids => ids.map(id => IT[id].e + ' ' + esc(IT[id].n)).join(', ') || 'nada';
      feed(S, a, `🤝 <b>${esc(CM[tr.from].name)}</b> dio ${names(tr.give)} y recibió ${names(tr.want)} de <b>${esc(CM[tr.to].name)}</b>.`);
      break;
    }
    case 'fail': if (!T) return; T.fails[a.reto] = (T.fails[a.reto] || 0) + 1; break;
    case 'solve': {
      const r = RT[a.reto]; if (!T || !r || T.done[r.id] || S.phase !== 'tianguis' || !S.retos[a.comm].includes(r.id)) return;
      const items = a.items || [];
      if (!items.every(id => (T.inv[id] || 0) > 0)) return;
      if (!r.tags.every(tg => items.some(id => IT[id].tags.includes(tg)))) return;
      items.forEach(id => { if (['planta', 'arbol'].includes(IT[id].k)) T.inv[id]--; });
      T.meters[r.m] = clamp(T.meters[r.m] + 3);
      T.done[r.id] = { first: !(T.fails[r.id] > 0), items };
      if (r.tags.includes('N') && r.tags.includes('COBERTURA')) T.flags.milpa = true;
      feed(S, a, `✅ <b>${esc(CM[a.comm].name)}</b> resolvió «${esc(r.t)}» (${METERS[r.m].e} +3).`);
      break;
    }
    case 'event': {
      const ev = EV[a.ev]; if (!ev || S.events.some(e => e.id === ev.id)) return;
      S.events.push({ id: ev.id, ts: a.ts });
      if (ev.type === 'auto') {
        let hurt = 0;
        S.comms.forEach(c => {
          const X = S.teams[c]; if (!X.joined) return;
          const prot = ev.protect.some(tg => hasTag(X, tg)) || (ev.milpa && X.flags.milpa);
          let loss = prot ? 0 : ev.loss; const extra = !!(X.flags.soloComercial && (ev.id === 'sequia' || ev.id === 'plaga'));
          if (extra) loss += 1;
          X.meters[ev.m] = clamp(X.meters[ev.m] - loss);
          X.evRes[ev.id] = { prot, loss, extra };
          if (loss) hurt++;
        });
        feed(S, a, `${ev.e} <b>Evento: ${esc(ev.t)}.</b> ${hurt ? hurt + ' puesto(s) resultaron afectados.' : 'Todos los puestos resistieron.'}`);
      } else feed(S, a, `${ev.e} <b>Dilema: ${esc(ev.t)}.</b> Cada comunidad debe decidir.`);
      break;
    }
    case 'choose': {
      const ev = EV[a.ev]; if (!T || !ev || ev.type !== 'dilema' || T.choices[ev.id] || !S.events.some(e => e.id === ev.id)) return;
      const op = ev.opts[a.opt]; if (!op) return;
      T.choices[ev.id] = { opt: a.opt, why: a.why || '' };
      bump(T, op.fx); if (op.flag) T.flags[op.flag] = true;
      break;
    }
    case 'reflect': if (!T) return; T.reflect = a.answers; feed(S, a, `📝 <b>${esc(CM[a.comm].name)}</b> entregó su reflexión.`); break;
  }
}

function startSolve(rid) { modalCtx = { kind: 'solve', rid, sel: [], step: 'items', wait: 0 }; drawSolve(); }

async function sendTrade() {

function tradeCard(t, mine) {

}
function tTrueques(T) {
  if (S.phase === 'conocer') return '<div class="lock">Los trueques empiezan cuando abra el tianguis.</div>';
  const inc = S.tradeList.map(id => S.trades[id]).filter(t => t.to === me).reverse();

  <div class="card"><h2>Intención pedagógica</h2>
  <p>Que el alumnado comprenda que los saberes de los pueblos originarios sobre la milpa, las plantas medicinales y el bosque son <b>sistemas de conocimiento construidos por observación durante generaciones</b>, que pueden explicarse con conceptos de biología y que dependen unos de otros: el bosque cuida el agua, el agua sostiene la milpa, la milpa y el monte dan alimento y medicina.</p>

  <div class="card noprint"><h2>Preparación técnica (una sola vez)</h2><ol>
